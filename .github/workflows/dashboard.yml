name: dashboard

on:
  pull_request:
    paths:
      - 'dashboard/**'
      - 'internal/dashboard/**'
      - '.github/workflows/dashboard.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run format:check
      - run: npm run build
      - name: Verify embedded assets match source
        run: git diff --exit-code -- ../internal/dashboard/web
